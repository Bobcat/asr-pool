[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asr-pool"
version = "0.1.0"
description = "Standalone ASR pool service with warm WhisperX runners"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.30",
]

[tool.setuptools.packages.find]
include = ["app*"]
